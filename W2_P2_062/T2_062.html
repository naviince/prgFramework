<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T2_062</title>
</head>
<body>
    <h1>Program Pencetak Angka - T2_062</h1>
    <button onclick="cetakAngka()">Cetak Angka</button>
    <div id="hasil" style="margin-top: 20px; line-height: 1.6;"></div>

    <script>

        function cetakAngka() {
            let hasil = [];
            for (let i = 1; i <= 100; i++) {
                if (i % 3 === 0 && i % 5 === 0) {
                    hasil.push("MI2A");
                } else if (i % 3 === 0) {
                    hasil.push("MI");
                } else if (i % 5 === 0) {
                    hasil.push("2A");
                } else {
                    hasil.push(i);
                }
            }
            document.getElementById("hasil").innerHTML = hasil.join(", ");
        }
    </script>
</body>
</html>
